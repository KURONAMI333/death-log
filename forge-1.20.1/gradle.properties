# Death Log - Forge 1.20.1 build
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 1.20.1 = Java 17. System JAVA_HOME is JDK 25 (too new for ForgeGradle) — pin JDK 17.
org.gradle.java.home=C:/Program Files/Java/jdk-17

# ─── Minecraft / Forge ──────────────────────────────────────────
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.13
forge_version_range=[47,)
loader_version_range=[47,)

# ─── Parchment ─────────────────────────────────────────────────
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# ─── Mod metadata ──────────────────────────────────────────────
mod_id=deathlog
mod_name=Death Log
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.kuronami.deathlog
mod_authors=KURONAMI
mod_description=/deaths — a persistent list of where you last died (coords, dimension, in-world day, cause), kept across restarts. No gravestone block, no map dependency, no client mod: just a server-side log so you can actually walk back to your stuff. Distinct from a single-death forensic report — this is your history. Server-side, no dependencies, 9 languages.
